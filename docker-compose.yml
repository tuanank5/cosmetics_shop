# Tùy chọn cho dev local.
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: beautyshop
      MARIADB_USER: beautyshop
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting MariaDB}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - beautyshop_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
  mailpit:
    image: axllent/mailpit:v1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  beautyshop_db:
