# TÙY CHỌN chỉ cho dev local. Nếu đã có MariaDB, không cần Docker.
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: beautyshop
      MARIADB_USER: beautyshop
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting MariaDB}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - beautyshop_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  beautyshop_db:
