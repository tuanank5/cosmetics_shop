<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Mã giảm giá · Quản trị BeautyShop')}"></head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>
<main id="main" tabindex="-1" class="page-content catalog-admin">
    <nav th:replace="~{fragments/ui :: breadcrumbTrail(${id == null ? 'Thêm mới' : 'Chỉnh sửa'}, ~{:: .crumb-parent}, false)}">
        <li class="crumb-parent" th:if="${voucherBack != null}"><a th:href="@{${voucherBack}}">Tổng quan</a></li>
        <li class="crumb-parent"><a th:href="@{${backToVouchers}}">Mã giảm giá</a></li>
    </nav>
    <h1 th:text="${id == null ? 'Tạo mã giảm giá' : 'Sửa mã giảm giá'}">Sửa mã giảm giá</h1>
    <form class="catalog-form" th:action="${id == null} ? @{/admin/vouchers/new} : @{/admin/vouchers/{id}/edit(id=${id})}"
          th:object="${form}" method="post">
        <th:block th:replace="~{fragments/nav-fields :: adminSource}"></th:block>
        <th:block th:replace="~{fragments/admin-table :: listSource(${listSourceFields})}"></th:block>
        <ul class="catalog-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
            <li th:each="error : ${#fields.globalErrors()}" th:text="${error}"></li>
        </ul>
        <label>Mã giảm giá <input th:field="*{maApDung}" maxlength="80" required></label>
        <small class="catalog-error" th:errors="*{maApDung}"></small>
        <label>Phạm vi giảm <select th:field="*{slot}"><option value="HANG">Hàng</option><option value="VAN_CHUYEN">Vận chuyển</option></select></label>
        <label>Số lượt tối đa mỗi khách <input type="number" th:field="*{gioiHanKhach}" min="0"></label>
        <p>Nhập ID cách nhau bằng dấu phẩy. Để trống để áp dụng cho mọi đối tượng trong chiều đó.</p>
        <label>Sản phẩm <input th:field="*{sanPham}" maxlength="4000"></label>
        <label>Danh mục <input th:field="*{danhMuc}" maxlength="4000"></label>
        <label>Thương hiệu <input th:field="*{thuongHieu}" maxlength="4000"></label>
        <label>Khách hàng <input th:field="*{nguoiDung}" maxlength="4000"></label>
        <label>Loại giảm giá
            <select th:field="*{loaiGiamGia}" required>
                <option value="">Chọn loại</option>
                <option value="FIXED">Số tiền cố định (₫)</option>
                <option value="PERCENT">Phần trăm (%)</option>
            </select>
        </label>
        <small class="catalog-error" th:errors="*{loaiGiamGia}"></small>
        <label>Số tiền hoặc phần trăm giảm <input type="number" th:field="*{giaTriGiam}" min="1" max="999999999999999" step="1" required></label>
        <small class="catalog-error" th:errors="*{giaTriGiam}"></small>
        <label>Mức giảm tối đa (₫, tùy chọn) <input type="number" th:field="*{mucGiamToiDa}" min="0" max="999999999999999" step="1"></label>
        <small class="catalog-error" th:errors="*{mucGiamToiDa}"></small>
        <label>Tiền hàng tối thiểu để dùng mã (₫) <input type="number" th:field="*{donToiThieu}" min="0" max="999999999999999" step="1" required></label>
        <small class="catalog-error" th:errors="*{donToiThieu}"></small>
        <label>Giới hạn sử dụng <input type="number" th:field="*{gioiHanSuDung}" min="0" max="2147483647" step="1" required></label>
        <small class="catalog-error" th:errors="*{gioiHanSuDung}"></small>
        <fieldset>
            <legend>Thời gian áp dụng (giờ UTC, chậm hơn giờ Việt Nam 7 tiếng)</legend>
            <label>Bắt đầu <input type="datetime-local" th:field="*{batDauLuc}" step="any" required></label>
            <small class="catalog-error" th:errors="*{batDauLuc}"></small>
            <label>Kết thúc <input type="datetime-local" th:field="*{ketThucLuc}" step="any" required></label>
            <small class="catalog-error" th:errors="*{ketThucLuc}"></small>
        </fieldset>
        <label class="catalog-checkbox"><input type="checkbox" th:field="*{dangHoatDong}"> Đang bật</label>
        <div><button class="btn btn--primary" type="submit">Lưu mã giảm giá</button></div>
    </form>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
