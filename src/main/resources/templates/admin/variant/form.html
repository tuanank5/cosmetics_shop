<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chỉnh sửa SKU · BeautyShop</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin-catalog.css}">
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>
<main class="page-content catalog-admin">
    <a class="text-link" th:href="@{/admin/catalog/products/{p}/variants(p=${sanPham.ma})}">Quay lại SKU</a>
    <h1 th:text="|SKU · ${sanPham.ten}|">SKU</h1>
    <form class="catalog-form" th:action="@{${action}}" th:object="${form}" method="post" enctype="multipart/form-data">
        <label>SKU <input th:field="*{sku}" required maxlength="100"></label>
        <small class="catalog-error" th:errors="*{sku}"></small>
        <label>Tên biến thể <input th:field="*{tenBienThe}" required maxlength="200" placeholder="Ví dụ: 30 ml"></label>
        <small class="catalog-error" th:errors="*{tenBienThe}"></small>
        <label>Giá bán (VNĐ) <input type="number" min="0" step="1" th:field="*{giaBan}" required></label>
        <small class="catalog-error" th:errors="*{giaBan}"></small>
        <label>Số lượng trong kho <input type="number" min="0" step="1" th:field="*{soLuongTrongKho}" required></label>
        <small class="catalog-error" th:errors="*{soLuongTrongKho}"></small>
        <label>Ảnh SKU <input type="file" name="hinhAnh" accept="image/jpeg,image/png"></label>
        <small>PNG hoặc JPEG, tối đa 2 MB và 2048 × 2048 px. Khi sửa, để trống để giữ ảnh hiện có.</small>
        <small class="catalog-error" th:errors="*{hinhAnh}"></small>
        <div th:if="${anhHienTai}">
            <img th:src="@{${anhHienTai}}" alt="Ảnh SKU hiện có" width="80" height="80">
            <label class="catalog-checkbox"><input type="checkbox" th:field="*{xoaHinhAnh}"> Xóa ảnh hiện có</label>
        </div>
        <fieldset>
            <legend>Một lô minh họa (tùy chọn)</legend>
            <p>Thông tin chỉ để hiển thị. Mỗi SKU hỗ trợ một lô minh họa.</p>
            <label>Mã lô <input th:field="*{maLoMinhHoa}" maxlength="100"></label>
            <small class="catalog-error" th:errors="*{maLoMinhHoa}"></small>
            <label>Hạn sử dụng <input type="date" th:field="*{hanSuDungMinhHoa}"></label>
            <small class="catalog-error" th:errors="*{hanSuDungMinhHoa}"></small>
        </fieldset>
        <label class="catalog-checkbox"><input type="checkbox" th:field="*{dangHoatDong}"> Đang hoạt động</label>
        <div><button class="btn btn-primary" type="submit">Lưu SKU</button></div>
    </form>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
