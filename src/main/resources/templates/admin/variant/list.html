<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Biến thể sản phẩm · BeautyShop')}"></head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>
<main id="main" tabindex="-1" class="page-content catalog-admin">
    <a class="text-link" th:href="@{/admin/catalog/products}">Quay lại sản phẩm</a>
    <h1 th:text="|Danh sách biến thể sản phẩm · ${sanPham.ten}|">Danh sách biến thể sản phẩm</h1>
    <p class="notice" role="status" th:if="${message}" th:text="${message}"></p>
    <a class="btn btn--secondary" th:href="@{/admin/catalog/products/{p}/variants/new(p=${sanPham.ma})}">Thêm biến thể sản phẩm</a>
    <p th:if="${#lists.isEmpty(bienThe)}">Chưa có biến thể sản phẩm.</p>
    <ul class="catalog-list">
        <li th:each="sku : ${bienThe}">
            <div>
                <img th:if="${sku.urlHinhAnh}" th:src="@{${sku.urlHinhAnh}}"
                     th:alt="${sku.tenBienThe}" width="80" height="80" loading="lazy">
                <strong th:text="${sku.tenBienThe}"></strong>
                <div th:text="|Mã biến thể sản phẩm: ${sku.sku} · ${sku.giaBan} ₫|"></div>
                <div th:text="|Trong kho: ${sku.soLuongTrongKho} · Đang giữ cho đơn hàng: ${sku.soLuongTamGiu} · Còn bán được: ${sku.soLuongKhaDung}|"></div>
                <small th:text="${sku.dangHoatDong} ? 'Đang hoạt động' : 'Ngừng hoạt động'"></small>
                <div th:if="${sku.maLoMinhHoa}" th:text="|Mã lô tham khảo: ${sku.maLoMinhHoa}|"></div>
                <div th:if="${sku.hanSuDungMinhHoa}" th:text="|Hạn sử dụng tham khảo: ${#temporals.format(sku.hanSuDungMinhHoa, 'dd/MM/yyyy')}|"></div>
            </div>
            <div class="catalog-actions">
                <a class="btn btn--secondary" th:href="@{/admin/catalog/products/{p}/variants/{v}/edit(p=${sanPham.ma},v=${sku.maBienThe})}">Sửa</a>
                <form th:if="${sku.dangHoatDong}" method="post"
                      th:action="@{/admin/catalog/products/{p}/variants/{v}/delete(p=${sanPham.ma},v=${sku.maBienThe})}">
                    <button class="btn btn--secondary" type="submit">Ngừng bán</button>
                </form>
            </div>
        </li>
    </ul>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
