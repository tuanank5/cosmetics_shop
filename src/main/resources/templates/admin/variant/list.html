<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biến thể sản phẩm · BeautyShop</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin-catalog.css}">
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>
<main class="page-content catalog-admin">
    <a class="text-link" th:href="@{/admin/catalog/products}">Quay lại sản phẩm</a>
    <h1 th:text="|Biến thể · ${sanPham.ten}|">Biến thể</h1>
    <p class="notice" role="status" th:if="${message}" th:text="${message}"></p>
    <a class="btn" th:href="@{/admin/catalog/products/{p}/variants/new(p=${sanPham.ma})}">Thêm SKU</a>
    <p th:if="${#lists.isEmpty(bienThe)}">Chưa có SKU.</p>
    <ul class="catalog-list">
        <li th:each="sku : ${bienThe}">
            <div>
                <img th:if="${sku.urlHinhAnh}" th:src="@{${sku.urlHinhAnh}}"
                     th:alt="${sku.tenBienThe}" width="80" height="80" loading="lazy">
                <strong th:text="${sku.tenBienThe}"></strong>
                <div th:text="|SKU ${sku.sku} · ${sku.giaBan} ₫|"></div>
                <div th:text="|Trong kho: ${sku.soLuongTrongKho} · Tạm giữ: ${sku.soLuongTamGiu} · Khả dụng: ${sku.soLuongKhaDung}|"></div>
                <small th:text="${sku.dangHoatDong} ? 'Đang hoạt động' : 'Ngừng hoạt động'"></small>
                <div th:if="${sku.maLoMinhHoa}" th:text="|Lô minh họa: ${sku.maLoMinhHoa}|"></div>
                <div th:if="${sku.hanSuDungMinhHoa}" th:text="|Hạn dùng minh họa: ${#temporals.format(sku.hanSuDungMinhHoa, 'dd/MM/yyyy')}|"></div>
            </div>
            <div class="catalog-actions">
                <a class="btn" th:href="@{/admin/catalog/products/{p}/variants/{v}/edit(p=${sanPham.ma},v=${sku.maBienThe})}">Sửa</a>
                <form th:if="${sku.dangHoatDong}" method="post"
                      th:action="@{/admin/catalog/products/{p}/variants/{v}/delete(p=${sanPham.ma},v=${sku.maBienThe})}">
                    <button class="btn" type="submit">Ngừng bán</button>
                </form>
            </div>
        </li>
    </ul>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
