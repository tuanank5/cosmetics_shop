<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kho tri thức · BeautyShop</title>
<link rel="stylesheet" th:href="@{/css/theme.css}">
<link rel="stylesheet" th:href="@{/css/admin-catalog.css}"></head>
<body><div th:replace="~{fragments/header :: siteHeader}"></div>
<main class="page-content">
    <h1>Kho tri thức tư vấn</h1>
    <p class="notice" role="status" th:if="${message}" th:text="${message}"></p>
    <p class="form-error" role="alert" th:if="${error}" th:text="${error}"></p>
    <p th:unless="${trangThai.aiEnabled}">Provider đang tắt. Khách có thể tìm FAQ · không phải AI.</p>
    <div th:if="${trangThai.aiEnabled}">
        <p th:text="|Số đoạn đã lập chỉ mục: ${trangThai.soDoan}|"></p>
        <p th:if="${trangThai.capNhat}" th:text="|Nạp gần nhất (UTC): ${trangThai.capNhat}|"></p>
        <form method="post" th:action="@{/admin/ai/reindex}">
            <button class="btn-primary" type="submit" th:disabled="${trangThai.dangNap}">Nạp lại FAQ và catalog</button>
        </form>
    </div>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div></body></html>
