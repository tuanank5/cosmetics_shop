<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Nguồn thông tin tư vấn · BeautyShop')}"></head>
<body><div th:replace="~{fragments/header :: siteHeader}"></div>
<main id="main" tabindex="-1" class="page-content">
    <h1>Nguồn thông tin tư vấn</h1>
    <p class="notice" role="status" th:if="${message}" th:text="${message}"></p>
    <p class="form-error" role="alert" th:if="${error}" th:text="${error}"></p>
    <p th:unless="${trangThai.aiEnabled}">Tư vấn AI đang tắt. Khách vẫn có thể tra cứu câu hỏi thường gặp.</p>
    <div th:if="${trangThai.aiEnabled}">
        <p th:text="|Số đoạn thông tin đã chuẩn bị cho tư vấn AI: ${trangThai.soDoan}|"></p>
        <p th:if="${trangThai.capNhat}" th:text="|Cập nhật nguồn lần gần nhất (giờ UTC): ${trangThai.capNhat}|"></p>
        <form method="post" th:action="@{/admin/ai/reindex}">
            <button class="btn btn--primary" type="submit" th:disabled="${trangThai.dangNap}">Làm mới nguồn tư vấn từ câu hỏi thường gặp và danh mục sản phẩm</button>
        </form>
    </div>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div></body></html>
