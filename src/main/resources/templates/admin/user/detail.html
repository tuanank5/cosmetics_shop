<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Chi tiết tài khoản · BeautyShop')}"></head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>
<main id="main" tabindex="-1" class="page-content login-wrap">
    <nav th:replace="~{fragments/ui :: breadcrumbTrail('Chi tiết tài khoản', ~{:: .crumb-parent}, false)}">
        <li class="crumb-parent"><a th:href="@{${backToUsers}}">Quản lý tài khoản</a></li>
    </nav>
    <h1>Chi tiết tài khoản</h1>
    <div th:replace="~{fragments/ui :: notices(${message}, ${error})}"></div>
    <p th:text="${hoTen}"></p>
    <p th:text="${email}"></p>
    <p th:text="${daXacMinhEmail ? 'Email đã xác minh' : 'Email chưa xác minh'}"></p>
    <p th:text="${coMatKhau ? 'Đã thiết lập mật khẩu' : 'Chưa thiết lập mật khẩu'}"></p>
    <p th:each="provider : ${providers}" th:text="${provider == 'google' ? 'Google đã liên kết' : 'GitHub đã liên kết'}"></p>
    <details class="disclosure" th:if="${duDieuKien}">
        <summary>Gửi yêu cầu đặt lại mật khẩu</summary>
        <form class="login-card" th:action="@{/admin/users/{id}/password-reset(id=${id})}" method="post">
            <input type="hidden" name="q" th:value="${q}">
            <input th:if="${fromList}" type="hidden" name="fromList" value="true">
            <input type="hidden" name="page" th:value="${page}">
            <input th:if="${active != null}" type="hidden" name="active" th:value="${active}">
            <input th:if="${role != null}" type="hidden" name="role" th:value="${role.name()}">
            <p>Chủ tài khoản sẽ nhận email để tự đặt mật khẩu mới.</p>
            <label for="reason">Lý do hỗ trợ</label>
            <select id="reason" name="reason" required>
                <option value="">Chọn lý do</option>
                <option value="KHACH_YEU_CAU">Khách yêu cầu</option>
                <option value="HO_TRO_BAO_MAT">Hỗ trợ bảo mật</option>
            </select>
            <button class="btn btn--primary" type="submit"
                    data-confirm="Gửi email đặt lại mật khẩu cho tài khoản này?">Xác nhận gửi yêu cầu</button>
        </form>
    </details>
    <p th:unless="${duDieuKien}">Tài khoản hiện chưa đủ điều kiện đặt lại mật khẩu qua email.</p>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
