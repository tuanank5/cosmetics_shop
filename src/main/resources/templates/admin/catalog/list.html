<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(|${label} · Quản trị BeautyShop|)}"></head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>
<main id="main" tabindex="-1" class="page-content admin-workspace">
    <nav class="admin-tabs" aria-label="Quản lý catalog">
        <a th:href="@{/admin/catalog/categories}" th:attr="aria-current=${section == 'categories' ? 'page' : null}">Danh mục</a>
        <a th:href="@{/admin/catalog/brands}" th:attr="aria-current=${section == 'brands' ? 'page' : null}">Thương hiệu</a>
        <a th:href="@{/admin/catalog/products}" th:attr="aria-current=${product ? 'page' : null}">Sản phẩm</a>
    </nav>
    <header class="admin-page-head">
        <div>
            <h1 th:text="|Quản lý ${#strings.toLowerCase(label)}|">Quản lý danh mục</h1>
            <p class="admin-subtitle" th:text="${product ? 'Quản lý thông tin, trạng thái bán và biến thể.' : 'Quản lý các nhóm sản phẩm hiển thị trên cửa hàng.'}"></p>
        </div>
        <a class="btn btn--primary" th:href="@{/admin/catalog/{section}/new(section=${section})}" th:text="|Thêm ${#strings.toLowerCase(label)}|">Thêm mới</a>
    </header>
    <div th:replace="~{fragments/ui :: notices(${message}, ${error})}"></div>
    <p class="notice" th:if="${#lists.isEmpty(items)}">Chưa có dữ liệu.</p>
    <div th:unless="${#lists.isEmpty(items)}" class="admin-table-scroll" tabindex="0" role="region" th:aria-label="|Bảng ${#strings.toLowerCase(label)}|">
        <table class="admin-table" th:classappend="${!product ? 'admin-table--compact' : null}">
            <thead><tr>
                <th th:if="${product}" scope="col">Ảnh</th>
                <th scope="col" th:text="${product ? 'Mã sản phẩm' : 'Mã'}"></th>
                <th scope="col" th:text="|Tên ${#strings.toLowerCase(label)}|"></th>
                <th th:if="${product}" scope="col">Danh mục</th>
                <th th:if="${product}" scope="col">Thương hiệu</th>
                <th th:if="${product}" scope="col" class="num">Biến thể</th>
                <th scope="col">Trạng thái</th><th scope="col">Hành động</th>
            </tr></thead>
            <tbody>
            <tr th:each="item : ${items}"
                th:with="soDon=${donDangXuLy?.get(item.ma) ?: 0}, biChan=${item.dangHoatDong and soDon > 0}, lyDo=|catalog-block-${item.ma}|">
                <td th:if="${product}"><span th:replace="~{fragments/admin-table :: thumbnail(${item.urlHinhAnh})}"></span></td>
                <td class="admin-code" th:text="${item.ma}"></td>
                <th scope="row"><span th:text="${item.ten}"></span><small class="admin-muted" th:text="${item.duongDan}"></small></th>
                <td th:if="${product}" th:text="${item.danhMuc}"></td>
                <td th:if="${product}" th:text="${item.thuongHieu}"></td>
                <td th:if="${product}" class="num" th:text="${item.soBienThe}"></td>
                <td><span class="admin-badge" th:attr="data-status=${item.dangHoatDong ? 'ACTIVE' : 'INACTIVE'}"
                          th:text="${item.dangHoatDong ? 'Đang hoạt động' : 'Ngừng hoạt động'}"></span></td>
                <td>
                    <div class="admin-inline">
                        <a class="btn btn--secondary admin-button" th:if="${product}"
                           th:href="@{/admin/catalog/products/{id}/variants(id=${item.ma})}">Biến thể</a>
                        <a class="btn btn--secondary admin-button" th:href="@{/admin/catalog/{section}/{id}/edit(section=${section},id=${item.ma})}"
                           th:aria-label="|Sửa ${item.ten}|">Sửa</a>
                        <form th:action="@{/admin/catalog/{section}/{id}/status(section=${section},id=${item.ma})}" method="post"
                              th:with="hanhDong=${item.dangHoatDong ? 'Ngừng hoạt động' : 'Kích hoạt lại'}">
                            <input type="hidden" name="active" th:value="${!item.dangHoatDong}">
                            <button class="btn btn--secondary admin-button" type="submit" th:text="${hanhDong}" th:disabled="${biChan}"
                                    th:attr="aria-label=|${hanhDong} ${item.ten}|,aria-describedby=${biChan ? lyDo : null}"></button>
                        </form>
                    </div>
                    <small class="admin-blocked" th:if="${biChan}" th:id="${lyDo}" th:text="|Còn ${soDon} đơn đang xử lý.|"></small>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
