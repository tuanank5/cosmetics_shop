<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đổi trả · BeautyShop</title><link rel="stylesheet" th:href="@{/css/theme.css}">
<link rel="stylesheet" th:href="@{/css/admin-catalog.css}"></head>
<body><div th:replace="~{fragments/header :: siteHeader}"></div>
<main class="page-content">
    <h1>Yêu cầu đổi trả</h1>
    <p class="notice" th:if="${#lists.isEmpty(yeuCau)}">Chưa có yêu cầu đổi trả.</p>
    <ul class="catalog-list">
        <li th:each="muc : ${yeuCau}">
            <a class="text-link" th:href="@{${base + '/' + muc.ma}}" th:text="|Yêu cầu #${muc.ma} · ${muc.maHienThi}|"></a>
            <span th:text="${muc.trangThai.label}"></span>
        </li>
    </ul>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div></body></html>
