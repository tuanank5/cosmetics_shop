<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sản phẩm · BeautyShop</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/storefront.css}">
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>
<main class="page-content storefront">
    <h1>Sản phẩm mỹ phẩm</h1>
    <form class="store-filters" method="get" th:action="@{/products}" role="search" aria-label="Lọc sản phẩm">
        <label>Tìm kiếm <input type="search" name="q" th:value="${q}" maxlength="160" placeholder="Tên sản phẩm hoặc SKU"></label>
        <label>Thương hiệu
            <select name="brand">
                <option value="">Tất cả</option>
                <option th:each="muc : ${thuongHieu}" th:value="${muc.duongDan}" th:text="${muc.ten}" th:selected="${muc.duongDan == brand}"></option>
            </select>
        </label>
        <label>Danh mục
            <select name="category">
                <option value="">Tất cả</option>
                <option th:each="muc : ${danhMuc}" th:value="${muc.duongDan}" th:text="${muc.ten}" th:selected="${muc.duongDan == category}"></option>
            </select>
        </label>
        <label>Loại da <input type="text" name="skinType" th:value="${skinType}" maxlength="100" placeholder="Ví dụ: da dầu"></label>
        <label>Sắp xếp
            <select name="sort">
                <option value="newest" th:selected="${sort == 'newest'}">Mới nhất</option>
                <option value="priceAsc" th:selected="${sort == 'priceAsc'}">Giá tăng dần</option>
                <option value="priceDesc" th:selected="${sort == 'priceDesc'}">Giá giảm dần</option>
            </select>
        </label>
        <button class="btn-primary" type="submit">Áp dụng</button>
        <a class="text-link store-filter-reset" th:href="@{/products}" th:if="${q != '' or brand != '' or category != '' or skinType != '' or sort != 'newest'}">Xóa bộ lọc</a>
    </form>

    <div class="notice" th:if="${ketQua.empty}">
        <strong>Không tìm thấy sản phẩm phù hợp.</strong>
        <p>Thử từ khóa khác hoặc xóa bộ lọc để xem tất cả sản phẩm.</p>
    </div>
    <ul class="store-grid" th:unless="${ketQua.empty}">
        <li th:each="the : ${ketQua.content}">
            <a class="store-card" th:href="@{/products/{slug}(slug=${the.duongDan})}">
                <div class="store-image">
                    <img th:if="${the.urlHinhAnh}" th:src="@{${the.urlHinhAnh}}" th:alt="${the.tenSanPham}" loading="lazy" decoding="async">
                    <span th:unless="${the.urlHinhAnh}" class="store-placeholder" aria-hidden="true"></span>
                </div>
                <div class="store-card-body">
                    <p class="store-brand" th:text="${the.tenThuongHieu}"></p>
                    <h2 th:text="${the.tenSanPham}"></h2>
                    <p class="store-price" th:text="|Từ ${#numbers.formatInteger(the.giaTu, 1, 'POINT')} ₫|"></p>
                    <small th:if="${the.soLuongKhaDungLonNhat == 0}">Hết hàng</small>
                </div>
            </a>
        </li>
    </ul>
    <nav class="store-pagination" th:if="${ketQua.totalPages > 1}" aria-label="Phân trang sản phẩm">
        <a class="text-link" th:if="${ketQua.hasPrevious()}"
           th:href="@{/products(q=${q},brand=${brand},category=${category},skinType=${skinType},sort=${sort},page=${ketQua.number - 1},size=${ketQua.size})}">Trang trước</a>
        <span th:text="|Trang ${ketQua.number + 1} / ${ketQua.totalPages}|"></span>
        <a class="text-link" th:if="${ketQua.hasNext()}"
           th:href="@{/products(q=${q},brand=${brand},category=${category},skinType=${skinType},sort=${sort},page=${ketQua.number + 1},size=${ketQua.size})}">Trang sau</a>
    </nav>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
