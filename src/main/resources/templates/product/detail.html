<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(|${chiTiet.sanPham.tenSanPham} · BeautyShop|)}"></head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>
<main id="main" tabindex="-1" class="page-content storefront product-page">
    <a class="pdp-back text-link" th:href="@{${navSource.duongVe}}"><span aria-hidden="true">←</span> <span th:text="${navSource.nhan}">Tất cả sản phẩm</span></a>
    <article th:with="sanPham=${chiTiet.sanPham}, sku=${chiTiet.dangChon}">
        <div class="pdp-layout">
            <div class="pdp-media" th:with="coAnh=${!#strings.isEmpty(#strings.trim(sku.urlHinhAnh))}">
                <img th:if="${coAnh}" data-sku-image th:src="@{${sku.urlHinhAnh}}"
                     th:alt="|${sanPham.tenSanPham} · ${sku.tenBienThe}|" width="600" height="600" decoding="async">
                <div class="store-placeholder" th:hidden="${coAnh}">
                    <span class="pdp-monogram" aria-hidden="true">B</span>
                    <span>Chưa có ảnh cho biến thể này</span>
                </div>
            </div>
            <div class="pdp-buy">
                <p class="eyebrow" th:text="${sanPham.thuongHieu.tenThuongHieu}"></p>
                <h1 th:text="${sanPham.tenSanPham}"></h1>
                <p class="pdp-selection" th:text="|${sku.tenBienThe} · Mã biến thể sản phẩm: ${sku.sku}|"></p>
                <div class="pdp-offer">
                    <strong class="pdp-price"><span th:replace="~{fragments/ui :: money(${sku.giaBan})}"></span></strong>
                    <span class="badge" th:classappend="${sku.soLuongKhaDung > 0 ? 'badge--success' : 'badge--error'}"
                          th:text="${sku.soLuongKhaDung > 0} ? |Còn ${sku.soLuongKhaDung} sản phẩm| : 'Hết hàng'"></span>
                </div>
                <form method="get" th:action="@{/products/{slug}(slug=${sanPham.duongDan})}">
                    <input th:each="p : ${navSource.thamSo}" type="hidden" th:name="${p.key}" th:value="${p.value}">
                    <fieldset class="pdp-variants">
                        <legend>Chọn biến thể sản phẩm</legend>
                        <div class="pdp-options">
                            <button th:each="muc : ${chiTiet.bienThe}" th:with="daChon=${muc.maBienThe == sku.maBienThe}"
                                    class="btn btn--secondary pdp-option" type="submit" name="variant" th:value="${muc.maBienThe}"
                                    th:attr="aria-current=${daChon ? 'true' : null}">
                                <span class="pdp-option-name" th:text="${muc.tenBienThe}"></span>
                                <span class="pdp-option-code" th:text="|Mã biến thể sản phẩm: ${muc.sku}|"></span>
                                <span th:replace="~{fragments/ui :: money(${muc.giaBan})}"></span>
                                <span class="pdp-option-stock" th:classappend="${muc.soLuongKhaDung == 0} ? 'sold-out'"
                                      th:text="${muc.soLuongKhaDung > 0} ? |Còn ${muc.soLuongKhaDung} sản phẩm| : 'Hết hàng'"></span>
                                <span class="pdp-current" th:if="${daChon}">Đang chọn</span>
                            </button>
                        </div>
                    </fieldset>
                </form>
                <div id="pdp-actions" class="pdp-actions" sec:authorize="isAnonymous() or hasRole('CUSTOMER')">
                    <form th:if="${sku.soLuongKhaDung > 0}" method="post" th:action="@{/cart/items}">
                        <input type="hidden" name="variant" th:value="${sku.maBienThe}">
                        <button class="btn btn--primary btn--lg" type="submit">Thêm vào giỏ</button>
                    </form>
                    <button th:unless="${sku.soLuongKhaDung > 0}" class="btn btn--lg" type="button" disabled>Biến thể này đã hết hàng</button>
                    <th:block th:replace="~{fragments/wishlist :: control(${sanPham.ma}, ${sanPham.tenSanPham}, 'pdp', false,
                        ${wishlistSaved != null and wishlistSaved.contains(sanPham.ma)})}"></th:block>
                    <p th:replace="~{fragments/wishlist :: feedback}"></p>
                </div>
                <dl class="pdp-lot" th:if="${!#strings.isEmpty(sku.maLoMinhHoa) or sku.hanSuDungMinhHoa != null}">
                    <th:block th:if="${sku.maLoMinhHoa}"><dt>Mã lô tham khảo</dt><dd th:text="${sku.maLoMinhHoa}"></dd></th:block>
                    <th:block th:if="${sku.hanSuDungMinhHoa}"><dt>Hạn sử dụng tham khảo</dt><dd th:text="${#temporals.format(sku.hanSuDungMinhHoa, 'dd/MM/yyyy')}"></dd></th:block>
                </dl>
            </div>
        </div>
        <div class="pdp-content">
            <section th:if="${!#strings.isEmpty(#strings.trim(sanPham.moTa))}">
                <h2>Mô tả sản phẩm</h2>
                <p class="pdp-copy" th:text="${sanPham.moTa}"></p>
            </section>
            <th:block th:if="${!#strings.isEmpty(#strings.trim(sanPham.huongDanSuDung))}">
                <details th:replace="~{fragments/ui :: productDisclosure(|${sanPham.duongDan}-huong-dan|, 'Hướng dẫn sử dụng', ${sanPham.huongDanSuDung})}"></details>
            </th:block>
            <th:block th:if="${!#strings.isEmpty(#strings.trim(sanPham.thanhPhan))}">
                <details th:replace="~{fragments/ui :: productDisclosure(|${sanPham.duongDan}-thanh-phan|, 'Thành phần', ${sanPham.thanhPhan})}"></details>
            </th:block>
            <th:block th:if="${!#strings.isEmpty(#strings.trim(sanPham.loaiDaPhuHop))}">
                <details th:replace="~{fragments/ui :: productDisclosure(|${sanPham.duongDan}-loai-da|, 'Loại da phù hợp', ${sanPham.loaiDaPhuHop})}"></details>
            </th:block>
            <section id="danh-gia" class="pdp-review-section" aria-labelledby="reviews-title" tabindex="-1">
                <h2 id="reviews-title">Đánh giá sản phẩm</h2>
                <p class="notice" role="status" th:if="${danhGia.khongTaiDuoc}">Tạm thời chưa tải được đánh giá. Vui lòng thử lại sau.</p>
                <th:block th:unless="${danhGia.khongTaiDuoc}" th:with="tt=${danhGia.tomTat}">
                    <p class="muted" th:if="${tt.soLuong == 0}">Chưa có đánh giá được duyệt.</p>
                    <div class="review-summary" th:if="${tt.soLuong > 0}">
                        <div class="review-score">
                            <strong th:text="${tt.trungBinhHienThi}"></strong>
                            <span th:replace="~{fragments/rating :: stars(${tt.nuaSao}, |${tt.trungBinhHienThi} trên 5 sao|)}"></span>
                            <span class="muted" th:text="|${tt.soLuong} đánh giá|"></span>
                        </div>
                        <ul class="review-bars" aria-label="Phân bố số sao">
                            <li th:each="sao : ${#numbers.sequence(5, 1, -1)}">
                                <span th:id="|review-bar-${sao}|" th:text="|${sao} sao|"></span>
                                <progress max="100" th:value="${tt.phanTram(sao)}" th:attr="aria-labelledby=|review-bar-${sao}|"
                                          th:text="|${tt.phanTram(sao)}%|"></progress>
                                <span class="review-bar-count" th:text="${tt.soSao(sao)}"></span>
                            </li>
                        </ul>
                    </div>
                    <ul class="pdp-reviews" th:unless="${danhGia.danhSach.empty}">
                        <li th:each="dg : ${danhGia.danhSach.content}">
                            <div class="review-meta">
                                <strong th:text="${dg.tenHienThi}"></strong>
                                <span class="review-badge">Đã mua hàng</span>
                                <time th:datetime="${dg.ngayIso}" th:text="${dg.ngayHienThi}"></time>
                            </div>
                            <span th:replace="~{fragments/rating :: stars(${dg.soSao * 2}, |${dg.soSao} trên 5 sao|)}"></span>
                            <p class="pdp-copy" th:unless="${#strings.isEmpty(dg.noiDung)}" th:text="${dg.noiDung}"></p>
                        </li>
                    </ul>
                    <div th:replace="~{fragments/ui :: pagination(${pager}, 'Phân trang đánh giá')}"></div>
                </th:block>
            </section>
        </div>
    </article>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script defer th:src="@{/js/wishlist.js}"></script>
</body>
</html>
