<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng ký · BeautyShop</title><link rel="stylesheet" th:href="@{/css/theme.css}"></head>
<body><div th:replace="~{fragments/header :: siteHeader}"></div>
<main class="page-content login-wrap">
    <h1>Đăng ký</h1>
    <form class="login-card" method="post" th:action="@{/register}" th:object="${form}">
        <label for="hoTen">Họ và tên</label>
        <input th:field="*{hoTen}" autocomplete="name" maxlength="160" required>
        <small class="form-error" th:errors="*{hoTen}"></small>
        <label for="email">Email</label>
        <input type="email" th:field="*{email}" autocomplete="email" maxlength="190" required>
        <small class="form-error" th:errors="*{email}"></small>
        <label for="matKhau">Mật khẩu</label>
        <input type="password" id="matKhau" name="matKhau" autocomplete="new-password" minlength="12" maxlength="72" required>
        <small class="form-error" th:errors="*{matKhau}"></small>
        <small class="form-error" th:errors="*{doDaiBcryptHopLe}"></small>
        <button class="btn-primary" type="submit">Tạo tài khoản</button>
    </form>
    <p><a class="text-link" th:href="@{/login}">Đăng nhập</a></p>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div></body></html>
