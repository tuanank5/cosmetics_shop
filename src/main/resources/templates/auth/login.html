<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập · BeautyShop</title><link rel="stylesheet" th:href="@{/css/theme.css}"></head>
<body><div th:replace="~{fragments/header :: siteHeader}"></div><main class="page-content login-wrap">
<p class="eyebrow">TÀI KHOẢN KHÁCH HÀNG</p><h1>Đăng nhập</h1>
<p class="notice" role="status" th:if="${param.registered}">Đăng ký thành công. Bạn có thể đăng nhập.</p>
<form method="post" th:action="@{/login}" class="login-card">
<label for="username">Email</label><input id="username" name="username" type="email" autocomplete="username" maxlength="190" required>
<label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<p class="form-error" role="alert" th:if="${param.error}">Email hoặc mật khẩu không hợp lệ.</p>
<p class="form-error" role="alert" th:if="${param.cartError}">Chưa thể đồng bộ giỏ. Vui lòng đăng nhập lại.</p>
<p class="form-error" role="alert" th:if="${param.inactive}">Phiên đã hết hiệu lực. Vui lòng đăng nhập lại.</p>
<button type="submit" class="btn-primary">Đăng nhập</button>
</form><p><a class="text-link" th:href="@{/register}">Tạo tài khoản</a></p>
</main><div th:replace="~{fragments/footer :: siteFooter}"></div></body></html>
