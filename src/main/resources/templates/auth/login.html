<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập · BeautyShop</title><link rel="stylesheet" th:href="@{/css/theme.css}"></head>
<body><div th:replace="~{fragments/header :: siteHeader}"></div><main class="page-content login-wrap">
<p class="eyebrow">TÀI KHOẢN KHÁCH HÀNG</p><h1>Đăng nhập</h1>
<div class="notice"><strong>Đăng nhập chưa mở.</strong><p>Bạn vẫn có thể xem trang chủ và danh mục.</p></div>
<form method="post" th:action="@{/login}" class="login-card">
<label for="username">Tên đăng nhập</label><input id="username" name="username" autocomplete="username" required>
<label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<p class="form-error" role="alert" th:if="${param.error}">Không thể đăng nhập lúc này.</p>
<button type="submit" class="btn-primary">Đăng nhập</button>
</form></main><div th:replace="~{fragments/footer :: siteFooter}"></div></body></html>
