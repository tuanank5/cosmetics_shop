<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Quên mật khẩu · BeautyShop')}"></head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>
<main id="main" tabindex="-1" class="page-content login-wrap">
    <h1>Quên mật khẩu</h1>
    <p class="notice" role="status" th:if="${message}" th:text="${message}"></p>
    <p class="form-error" role="alert" th:if="${error}" th:text="${error}"></p>
    <form class="login-card" method="post" th:action="@{/forgot-password}">
        <label for="email">Email BeautyShop</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="190" required>
        <button class="btn btn--primary" type="submit">Gửi yêu cầu</button>
    </form>
    <p><a class="text-link" th:href="@{/login}">Về trang đăng nhập</a></p>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
