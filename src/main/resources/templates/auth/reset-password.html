<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đặt lại mật khẩu · BeautyShop')}"></head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>
<main id="main" tabindex="-1" class="page-content login-wrap">
    <h1>Đặt lại mật khẩu</h1>
    <p class="notice" role="status" th:if="${message}" th:text="${message}"></p>
    <p class="form-error" role="alert" th:if="${error}" th:text="${error}"></p>
    <form th:if="${coLink}" class="login-card" method="post" th:action="@{/reset-password}">
        <label for="matKhauMoi">Mật khẩu mới</label>
        <input id="matKhauMoi" name="matKhauMoi" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
        <label for="xacNhan">Nhập lại mật khẩu mới</label>
        <input id="xacNhan" name="xacNhan" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
        <button class="btn btn--primary" type="submit">Lưu mật khẩu mới</button>
    </form>
    <p th:unless="${coLink}">Liên kết không hợp lệ, đã hết hạn hoặc đã được sử dụng.</p>
    <p><a class="text-link" th:href="@{/forgot-password}">Yêu cầu liên kết mới</a></p>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
