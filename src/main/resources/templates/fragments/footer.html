<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="siteFooter">
<footer class="site-footer">
  <div class="footer-grid">
    <div>
      <p class="footer-brand"><img th:src="@{/img/brand/beautyshop-wordmark.svg}" alt="BeautyShop" width="862" height="71"></p>
      <p>Mỹ phẩm đa thương hiệu.<br>Vẻ đẹp trong từng lựa chọn.</p>
      <small>© 2026 BeautyShop</small>
    </div>
    <nav aria-label="Khám phá cửa hàng">
      <h2>Khám phá</h2>
      <a th:href="@{/products}">Cửa hàng</a>
      <a th:href="@{/products#categories}">Danh mục</a>
      <a th:href="@{/products#brands}">Thương hiệu</a>
    </nav>
    <nav aria-label="Liên kết tài khoản" sec:authorize="isAnonymous()">
      <h2>Tài khoản</h2>
      <a th:href="@{/login}">Đăng nhập</a>
      <a th:href="@{/register}">Tạo tài khoản</a>
      <a th:href="@{/cart}">Giỏ hàng</a>
    </nav>
    <nav aria-label="Liên kết tài khoản" sec:authorize="hasRole('CUSTOMER')">
      <h2>Tài khoản</h2>
      <a th:href="@{/account}">Hồ sơ</a>
      <a th:href="@{/orders}">Đơn hàng</a>
      <a th:href="@{/account/wishlist}">Sản phẩm yêu thích</a>
      <a th:href="@{/cart}">Giỏ hàng</a>
    </nav>
    <nav aria-label="Quản trị cửa hàng" sec:authorize="hasRole('ADMIN')">
      <h2>Quản trị</h2>
      <a th:href="@{/admin/catalog/categories}">Danh mục</a>
      <a th:href="@{/admin/catalog/brands}">Thương hiệu</a>
      <a th:href="@{/admin/catalog/products}">Sản phẩm</a>
    </nav>
    <nav aria-label="Hỗ trợ mua sắm">
      <h2>Đồng hành</h2>
      <a th:href="@{/chat}">Tư vấn sản phẩm</a>
      <a th:href="@{/account/returns}" sec:authorize="hasRole('CUSTOMER')">Yêu cầu đổi trả</a>
    </nav>
  </div>
</footer>
<div th:replace="~{fragments/ui :: confirmDialog}"></div>
</th:block>
</body>
</html>
