<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<article th:fragment="productCard(the, uuTienAnh)" class="product-tile"
         th:with="preview=${catalogPreviewMedia != null ? catalogPreviewMedia[the.duongDan] : null},
                  thumbnail=${preview != null and preview['thumbnailUrl'] != null ? preview['thumbnailUrl'] :
                    (preview != null and preview['videoPosterUrl'] != null ? preview['videoPosterUrl'] : the.urlHinhAnh)}">
<a class="store-card"
   th:id="${navOrigin != null and the.maSanPham != null ? navOrigin + '-product-' + the.maSanPham : null}"
   th:href="${navOrigin == 'catalog'}
     ? @{/products/{slug}(slug=${the.duongDan},from='catalog',q=${q},brand=${brand},category=${category},skinType=${skinType},sort=${sort},page=${ketQua.number},size=${ketQua.size},filterPanel=${filterPanel})}
     : (${sapXepTrangChu == 'priceAsc' or sapXepTrangChu == 'priceDesc'}
       ? @{/products/{slug}(slug=${the.duongDan},from=${navOrigin},sort=${sapXepTrangChu})}
       : @{/products/{slug}(slug=${the.duongDan},from=${navOrigin})})">
    <div class="store-card-media" th:with="coAnh=${!#strings.isEmpty(#strings.trim(thumbnail))}">
        <img th:if="${coAnh}" data-catalog-image th:src="@{${thumbnail}}" alt="" width="400" height="500"
             th:loading="${uuTienAnh ? 'eager' : 'lazy'}" decoding="async">
        <span class="store-card-fallback" data-catalog-placeholder th:hidden="${coAnh}">
            <span class="store-card-monogram" aria-hidden="true"><img th:src="@{/img/brand/beautyshop-mark.svg}" alt="" width="120" height="160" loading="lazy" decoding="async"></span>
            <span class="store-card-missing">Chưa có ảnh sản phẩm</span>
        </span>
        <video th:if="${preview != null and preview['previewVideoUrl'] != null}" data-product-preview
               th:attr="data-video-src=${preview['previewVideoUrl']},data-video-poster=${preview['videoPosterUrl']}"
               muted loop playsinline preload="none" aria-hidden="true" tabindex="-1"></video>
    </div>
    <div class="store-card-body">
        <p class="store-card-brand" th:text="${the.tenThuongHieu}"></p>
        <h3 th:text="${the.tenSanPham}"></h3>
        <p class="store-card-price">Từ <span th:replace="~{fragments/ui :: money(${the.giaTu})}"></span></p>
        <p class="muted" th:if="${tomTatDanhGia != null and tomTatDanhGia.khongTaiDuoc}">Đánh giá tạm thời không khả dụng.</p>
        <th:block th:with="tt=${tomTatDanhGia != null and the.maSanPham != null ? tomTatDanhGia.theoSanPham[the.maSanPham] : null}">
            <p class="store-card-rating" th:if="${tt != null and tt.soLuong > 0}">
                <span th:replace="~{fragments/rating :: stars(${tt.nuaSao}, |${tt.trungBinhHienThi} trên 5 sao|)}"></span>
                <span th:text="|${tt.trungBinhHienThi} · ${tt.soLuong} đánh giá|"></span>
            </p>
        </th:block>
        <span class="badge" th:classappend="${the.soLuongKhaDungLonNhat > 0 ? 'badge--success' : 'badge--error'}"
              th:text="${the.soLuongKhaDungLonNhat > 0 ? 'Còn hàng' : 'Hết hàng'}"></span>
    </div>
</a>
<th:block th:replace="~{fragments/wishlist :: control(${the.maSanPham}, ${the.tenSanPham}, ${navOrigin}, true,
    ${wishlistSaved != null and wishlistSaved.contains(the.maSanPham)})}"></th:block>
<button class="preview-toggle btn btn--secondary" type="button" data-preview-toggle hidden>Phát video xem trước</button>
</article>
</body>
</html>
