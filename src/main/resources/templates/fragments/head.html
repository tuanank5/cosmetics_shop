<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">BeautyShop</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/base.css}">
  <link rel="stylesheet" th:href="@{/css/components.css}">
  <link id="home-carousel-css" th:if="${homeCarouselCss ?: false}" rel="stylesheet" th:href="@{/css/vendor/swiper-14.4.0.min.css}">
  <link rel="stylesheet" th:href="@{/css/storefront.css}">
  <link rel="stylesheet" th:unless="${#strings.startsWith(uiPath ?: '', '/admin')}" th:href="@{/css/reference-pages.css}">
  <link id="brand-hero-css" th:if="${brandHeroCss ?: false}" rel="stylesheet" th:href="@{/css/brand-hero.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
</html>
