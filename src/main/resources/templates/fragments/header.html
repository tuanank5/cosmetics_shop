<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="siteHeader" class="site-header">
  <div class="topnote">CHĂM SÓC SẮC ĐẸP · TRẢI NGHIỆM TINH TẾ</div>
  <nav class="nav-shell" aria-label="Điều hướng chính">
    <a class="brand" th:href="@{/}">BEAUTY<span>SHOP</span></a>
    <div class="nav-links">
      <a th:href="@{/}">Trang chủ</a>
      <a th:href="@{/products}">Sản phẩm</a>
      <a th:href="@{/cart}" sec:authorize="isAnonymous() or hasRole('CUSTOMER')">Giỏ hàng</a>
      <a th:href="@{/login}" sec:authorize="isAnonymous()">Tài khoản</a>
      <a th:href="@{/account}" sec:authorize="hasRole('CUSTOMER')">Tài khoản</a>
      <a th:href="@{/admin/catalog}" sec:authorize="hasRole('ADMIN')">Quản trị</a>
      <a th:href="@{/admin/users}" sec:authorize="hasRole('ADMIN')">Người dùng</a>
      <a th:href="@{/admin/orders}" sec:authorize="hasRole('ADMIN')">Đơn hàng</a>
      <form class="nav-logout" method="post" th:action="@{/logout}" sec:authorize="isAuthenticated()">
        <button type="submit">Đăng xuất</button>
      </form>
    </div>
  </nav>
</header>
</body>
</html>
