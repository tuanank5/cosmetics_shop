<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<span th:fragment="image(url)" class="commerce-image" aria-hidden="true">
    <img th:if="${url != null}" th:src="@{${url}}" alt="" width="96" height="96" loading="lazy" decoding="async" data-commerce-image>
    <span class="commerce-monogram" aria-hidden="true">B</span>
</span>
<svg th:fragment="icon(name)" th:switch="${name}" class="shop-icon" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" focusable="false">
    <g th:case="'pin'"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></g>
    <g th:case="'ticket'"><path d="M4 6h16a1 1 0 0 1 1 1v2a3 3 0 0 0 0 6v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2a3 3 0 0 0 0-6V7a1 1 0 0 1 1-1Z"/></g>
    <g th:case="'wallet'"><path d="m4 8 13-4v4M4 8h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 1-2Zm17 5h-6a2 2 0 0 0 0 4h6"/></g>
    <g th:case="'truck'"><path d="M2 5h12v12H2zM14 9h4l4 4v4h-8"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></g>
    <g th:case="'cart'"><path d="M2 3h3l3 13h11l3-10H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></g>
    <g th:case="'bag'"><path d="M5 7h14l1 14H4L5 7Zm3 2V6a4 4 0 0 1 8 0v3"/></g>
    <g th:case="'shield'"><path d="M12 2 21 6v5c0 6-6 10-9 11-3-1-9-5-9-11V6Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></g>
    <g th:case="'info'"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></g>
    <g th:case="'user'"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g>
    <g th:case="'phone'"><path d="M5 3h4l2 5-3 2c1 3 3 5 6 6l2-3 5 2v4a2 2 0 0 1-2 2C10 20 4 14 3 5a2 2 0 0 1 2-2Z"/></g>
    <g th:case="'layers'"><path d="m12 3 10 5-10 5L2 8Zm10 9-10 5L2 12m20 4-10 5-10-5"/></g>
    <g th:case="'send'"><path d="m3 10 18-7-7 18-3.5-7.5L3 10Zm7.5 3.5L21 3"/></g>
    <g th:case="'check'"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></g>
    <g th:case="'clock'"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>
    <g th:case="'box'"><path d="m12 2 9 5v10l-9 5-9-5V7Zm0 10 9-5m-9 15V12L3 7"/></g>
    <g th:case="'card'"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/></g>
    <g th:case="'copy'"><rect x="8" y="7" width="12" height="14" rx="2"/><path d="M15 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h3"/></g>
    <g th:case="'grid'"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></g>
    <g th:case="'leaf'"><path d="M21 3c-2 0-8 0-13 4s-5 10 0 12c6 2 13-5 13-16ZM3 21l10-10"/></g>
    <g th:case="'book'"><path d="M12 5C9 3 5 3 2 4v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Zm0 0v15"/></g>
    <g th:case="'sparkle'"><path d="M12 2c0 6 4 10 10 10-6 0-10 4-10 10 0-6-4-10-10-10 6 0 10-4 10-10Z"/></g>
    <g th:case="'close'"><path d="m6 6 12 12M18 6 6 18"/></g>
    <g th:case="'arrow'"><path d="M4 12h15m-6-6 6 6-6 6"/></g>
    <g th:case="'chat'"><path d="M3 5h18v12H9l-5 4v-4H3Zm4 6h.01m5 0h.01m5 0h.01"/></g>
</svg>
</body>
</html>
