spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/beautyshop}
spring.datasource.username=${DB_USER:beautyshop}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.thymeleaf.cache=false
logging.level.com.beautyshop=INFO
spring.data.redis.host=${OTP_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${OTP_REDIS_PORT:6379}
spring.mail.host=${OTP_MAIL_HOST:127.0.0.1}
spring.mail.port=${OTP_MAIL_PORT:1025}
app.auth.otp.from=${OTP_MAIL_FROM:no-reply@beautyshop.test}
