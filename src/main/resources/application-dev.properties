spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:${DB_PORT:3306}/${DB_NAME:beautyshop}}
spring.datasource.username=${DB_USER:beautyshop}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.thymeleaf.cache=false
beautyshop.auth.public-url=${AUTH_PUBLIC_URL:http://localhost:8080}
spring.mail.host=${MAIL_HOST:127.0.0.1}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.from=beautyshop@localhost
logging.level.com.beautyshop=INFO
