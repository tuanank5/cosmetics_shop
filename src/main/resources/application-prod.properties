spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.thymeleaf.cache=true
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
spring.data.redis.host=${OTP_REDIS_HOST}
spring.data.redis.port=${OTP_REDIS_PORT:6379}
spring.data.redis.username=${OTP_REDIS_USERNAME:default}
spring.data.redis.password=${OTP_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${OTP_REDIS_SSL:true}
spring.mail.host=${OTP_MAIL_HOST}
spring.mail.port=${OTP_MAIL_PORT:587}
spring.mail.username=${OTP_MAIL_USERNAME}
spring.mail.password=${OTP_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
app.auth.otp.from=${OTP_MAIL_FROM}
# Bật HTTPS ở reverse proxy/hosting. Không ghi secrets trong source.
