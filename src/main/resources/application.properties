spring.application.name=BeautyShop
server.port=${PORT:8080}
spring.profiles.default=dev
# Gửi thật chờ owner xác nhận kênh hỗ trợ công khai. Mặc định chỉ ghi outbox.
app.account.mail-enabled=${ACCOUNT_MAIL_ENABLED:false}
app.ai.enabled=${AI_ENABLED:false}
app.ai.provider=${AI_PROVIDER:disabled}
app.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ai.ollama.chat-model=${OLLAMA_CHAT_MODEL:qwen2.5:3b}
app.ai.ollama.embed-model=${OLLAMA_EMBED_MODEL:bge-m3}
app.payment.momo.enabled=${MOMO_ENABLED:false}
app.payment.momo.mode=${MOMO_MODE:disabled}
app.payment.online-reservation-minutes=${ONLINE_RESERVATION_MINUTES:15}
spring.jpa.open-in-view=false
spring.thymeleaf.encoding=UTF-8
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
logging.charset.console=UTF-8
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=5000ms
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
beautyshop.auth.public-url=${AUTH_PUBLIC_URL:}
server.error.whitelabel.enabled=false
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/beautyshop_demo}
